<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgb(62, 164, 62), rgb(23, 23, 114));
            width: 100vw;
            height: 100vh;
            display: grid;
            place-content: center;
        }

        div {
            background: linear-gradient(green, blue);
            width: 400px;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        img {
            width: 150px;
            height: 150px;
            box-shadow: 3px 3px 3px 3px rgb(5, 199, 57);
            border-radius: 100%;
        }

        h2 {
            font-style: italic;
            color: white;
            background-color: rgb(10, 10, 99);
            border: 3px solid rgb(4, 113, 4);
            box-shadow: 2px 2px 2px rgb(83, 3, 244);
            border-radius: 50px;
            padding: 10px;
            margin: 20px;
        }


        p {
            color: white;
            background-color: rgb(25, 0, 255);
            box-shadow: 7px 7px 7px darkblue;
            border: 3px solid rgb(3, 37, 204);
            border-radius: 100px;
            padding: 10px;
            margin: 20px;
        }

        a {
            font-size: 12px;
            margin: 15px;
            text-decoration: none;
            background-color: crimson;
            color: white;
            padding: 10px;
            border-radius: 5px;
        }

        #call {
            background: linear-gradient(to right, #0cd20c, #09d428);

        }


        #wp {
            background: linear-gradient(to right, #25D366, #128C7E);
        }

        #email {
            background: linear-gradient(to right, #EA4335, #FF6F61);
        }
    </style>


</head>
