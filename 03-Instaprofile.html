<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My insta profile</title>

    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(white, aqua);
            width: 100vw;
            height: 100vh;
            display: grid;
            place-content: center;
        }

        div {
            background: linear-gradient(to right,
                    #feda75,
                    #fa7e1e,
                    #d62976,
                    #ba65dc,
                    #4f5bd5);
            width: 300px;
            height: 300px;
            text-align: center;
            border-radius: 20px;
            display: grid;
            place-content: center;
            text-align: center;
        }

        img {
            margin: 10px;
            width: 150px;
            height: 200px;
            border-radius: 7px;
            box-shadow: 3px 3px 3px rgb(216, 56, 190);

        }

        a {

            background: rgb(228, 100, 202);
            margin: 0px;
            padding: 5px;
            text-decoration: none;
            width: 170px;
            border-radius: 5px;
            color: white;
        }
    </style>
    
</head>

<body>
    <div>
        <img src="sumanbharti.jpeg" alt="suman">
        <a href="https://instagram.com/s_bharti17"><b>@s_bharti17</b></a>
    </div>

</body>

</html>
